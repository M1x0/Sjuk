<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <title>Sjuk Autonomous Org</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <h1>Virtuell Organisation - Kontrollpanel</h1>
    <p>Observera hur AI-organisationen utvecklas i realtid.</p>
  </header>
  <main>
    <section class="metrics">
      <div class="metric">
        <h2>Agenter</h2>
        <p id="agent-count">0</p>
      </div>
      <div class="metric">
        <h2>Aktiva projekt</h2>
        <p id="project-count">0</p>
      </div>
      <div class="metric">
        <h2>Kassa</h2>
        <p id="cash">0 kr</p>
      </div>
    </section>

    <section class="panels">
      <div class="panel">
        <h2>Projekt</h2>
        <table id="project-table">
          <thead>
            <tr>
              <th>Namn</th>
              <th>Status</th>
              <th>Budget</th>
              <th>Progress</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="panel">
        <h2>Ekonomi</h2>
        <ul id="finance-list"></ul>
      </div>
    </section>

    <section class="chat">
      <h2>Intern chathistorik</h2>
      <div id="messages"></div>
    </section>

    <section class="interview">
      <h2>Intervjua en agent</h2>
      <form id="interview-form">
        <label for="agent-select">Agent</label>
        <select id="agent-select"></select>
        <label for="question">Fråga</label>
        <input type="text" id="question" placeholder="Vad vill du veta?" required />
        <button type="submit">Skicka</button>
      </form>
      <div id="interview-response"></div>
    </section>
  </main>
  <script src="/static/dashboard.js"></script>
</body>
</html>
